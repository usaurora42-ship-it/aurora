<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aurora — Painel Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #080806;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Decorative grid background */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(#1a1608 1px, transparent 1px),
                linear-gradient(90deg, #1a1608 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Center glow */
        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, #c9a84c08 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            animation: fadeUp 0.7s ease forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Badge admin */
        .admin-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .admin-badge-line {
            flex: 1;
            height: 0.5px;
            background: #2a2010;
        }

        .admin-badge-text {
            font-size: 9px;
            letter-spacing: 5px;
            color: #5a4a28;
        }

        /* Logo */
        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid #c9a84c;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-style: italic;
            color: #c9a84c;
            margin-bottom: 14px;
        }

        .login-logo-name {
            display: block;
            font-size: 10px;
            letter-spacing: 8px;
            color: #e8d5a3;
            font-weight: 300;
        }

        /* Card */
        .login-card {
            background: #0c0a06;
            border: 0.5px solid #2a2414;
            padding: 40px 36px;
            position: relative;
        }

        .login-card::before,
        .login-card::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #c9a84c;
            border-style: solid;
        }
        .login-card::before {
            top: -1px; left: -1px;
            border-width: 1px 0 0 1px;
        }
        .login-card::after {
            bottom: -1px; right: -1px;
            border-width: 0 1px 1px 0;
        }

        /* Corner extras via spans */
        .corner-tr, .corner-bl {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #c9a84c;
            border-style: solid;
        }
        .corner-tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
        .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }

        .login-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 300;
            color: #f0e6c8;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 9px;
            letter-spacing: 3px;
            color: #4a3a20;
            margin-bottom: 0;
        }

        .login-divider {
            width: 24px;
            height: 0.5px;
            background: #c9a84c;
            margin: 16px 0 28px;
        }

        /* Error alert */
        .alert-login {
            background: #1a0a0a;
            border: 0.5px solid #5a1a1a;
            color: #c97a7a;
            font-size: 10px;
            letter-spacing: 1px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        /* Labels */
        .form-label-custom {
            display: block;
            font-size: 9px;
            letter-spacing: 3px;
            color: #7a6a50;
            margin-bottom: 8px;
        }

        /* Inputs */
        .form-input-custom {
            width: 100%;
            background: #080806;
            border: 0.5px solid #2a2414;
            border-radius: 0;
            color: #e8d5a3;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 300;
            padding: 12px 16px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        .form-input-custom:focus {
            border-color: #c9a84c;
            background: #0d0b07;
        }

        .form-input-custom::placeholder {
            color: #2a2010;
            font-size: 12px;
        }

        /* Error input */
        .form-input-custom.input-error {
            border-color: #5a1a1a;
        }

        .field-error {
            font-size: 9px;
            color: #c97a7a;
            letter-spacing: 1px;
            margin-top: -16px;
            margin-bottom: 16px;
            display: block;
        }

        /* Submit */
        .btn-login {
            width: 100%;
            background: #c9a84c;
            color: #080806;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 4px;
            padding: 15px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover { background: #d4b55a; }
        .btn-login:active { opacity: 0.85; }

        /* Back link */
        .back-link {
            text-align: center;
            margin-top: 28px;
        }
        .back-link a {
            font-size: 9px;
            letter-spacing: 3px;
            color: #2a2010;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link a:hover { color: #7a6a50; }
    </style>
</head>
<body>

    <div class="login-wrapper">

        <div class="admin-badge">
            <div class="admin-badge-line"></div>
            <span class="admin-badge-text">ÁREA RESTRITA</span>
            <div class="admin-badge-line"></div>
        </div>

        <div class="login-logo">
            <div class="login-logo-circle">A</div>
            <span class="login-logo-name">AURORA</span>
        </div>

        <div class="login-card">
            <span class="corner-tr"></span>
            <span class="corner-bl"></span>

            <h1 class="login-title">Painel Admin</h1>
            <p class="login-subtitle">ACESSO ADMINISTRATIVO</p>
            <div class="login-divider"></div>

            {% if errors and errors.login %}
                <div class="alert-login">
                    {{ errors.login[0] }}
                </div>
            {% endif %}

            <form action="/admin/login" method="post">

                <label class="form-label-custom" for="user_name">USUÁRIO</label>
                <input
                    class="form-input-custom {% if errors and errors.user_name %}input-error{% endif %}"
                    type="text"
                    id="user_name"
                    name="user_name"
                    placeholder="admin"
                    value="{{ data_input.user_name if data_input else '' }}"
                    required
                    autocomplete="username">
                {% if errors and errors.user_name %}
                    <span class="field-error">{{ errors.user_name[0] }}</span>
                {% endif %}

                <label class="form-label-custom" for="pwd">SENHA</label>
                <input
                    class="form-input-custom {% if errors and errors.pwd %}input-error{% endif %}"
                    type="password"
                    id="pwd"
                    name="pwd"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password">
                {% if errors and errors.pwd %}
                    <span class="field-error">{{ errors.pwd[0] }}</span>
                {% endif %}

                <button class="btn-login" type="submit">ENTRAR</button>

            </form>
        </div>

        <div class="back-link">
            <a href="/">← VOLTAR PARA O SITE</a>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
</body>
</html>
